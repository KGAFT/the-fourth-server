[package]
name = "the-fourth-server"
version = "0.4.5"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/KGAFT/the-fourth-server"
categories = ["asynchronous", "network-programming", "web-programming"]
keywords = ["tcp", "rkyv", "tokio", "asynchronous", "binary"]
readme = "README.md"
description = "A lightweight tcp server/client pair for network programming"
documentation = "https://docs.rs/the-fourth-server"

[lib]
name = "tfserver"
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
full = ["logging", "tls", "websocket"]
default = ["logging"]
logging = ["dep:log"]
tls = ["dep:tokio-rustls", "the-fourth-utils/tls"]
websocket = ["the-fourth-utils/websocket"]


[dependencies]
log = { version = "0.4", optional = true }
tokio-util = {version = "0.7", features = ["codec"]}
futures-util = { version = "0.3", features = ["sink", "io", "tokio-io", "futures-io", "io-compat"] }
the-fourth-utils = {version = "0.1", features = ["codec", "structure-type"]}
tf-macros = {version = "0.1"}

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["io-std", "io-util", "rt", "time", "sync", "net", "macros"] }
tokio-rustls = { version = "0.26", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "macros", "io-util", "rt", "time"] }
getrandom = { version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
wasm-bindgen-futures = "0.4.77"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
