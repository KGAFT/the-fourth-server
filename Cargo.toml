[package]
name = "the-fourth-server"
version = "0.4.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/KGAFT/the-fourth-server"
categories = ["asynchronous", "network-programming", "web-programming"]
keywords = ["tcp", "bincode", "tokio", "asynchronous", "binary"]
readme = "README.md"
description = "A lightweight tcp server/client pair for network programming"
documentation = "https://docs.rs/the-fourth-server"

[lib]
name = "tfserver"
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
default = ["logging"]
logging = ["dep:log"]


[dependencies]
log = { version = "0.4", optional = true }
sha2 = "0.10"
num_enum = "0.7"
rand = "0.9"
rkyv = { version = "0.8", features = ["unaligned"] }
tokio-util = {version = "0.7", features = ["codec"]}
futures-util = { version = "0.3", features = ["sink", "io", "tokio-io", "futures-io", "io-compat"] }
async-trait = { version = "0.1" }
bytes = "1.11"
ws_stream_wasm = "0.7"
pin-project = "1"
futures-io = "0.3.32"
spake2 = {version = "0.4", features = ["default"]}
aes-gcm = "0.10"
aead = "0.5"
hkdf = "0.12"
tf-macros = {version = "0.1"}

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
async-tungstenite = "0.34"
tokio-rustls = "0.26"

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "macros", "io-util", "rt", "time"] }
getrandom = { version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
